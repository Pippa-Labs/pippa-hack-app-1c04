# Pres Planner: a pre-drinks shopping list for a night out, and the shops to
# buy it from. CLAUDE.md is the contract this file follows.

manifest_version: 1

# Every hackathon app keeps nothing between calls. Do not change this.
persistence: none

# The public name shown with the app ("by royya6"). A pseudonym; CLAUDE.md,
# step 1, has the rules.
app_author_name: "royya6"

app:
  # Fixed by the repository name: Pippa-Labs/pippa-hack-app-1c04.
  id: hack.app_1c04
  name: Pres Planner
  # Bump this before pushing again once a version has been submitted for
  # review (0.1.0 -> 0.1.1); a draft can be pushed again under the same one.
  version: 0.1.0
  # Never the word "b-y" in here: the badge is parsed on it (CLAUDE.md).
  summary: >-
    Plans a pre-drinks shopping list for a night out that fits a group's
    budget, and finds off-licences and supermarkets close to where you are
    setting off. Sends only the place name to OpenStreetMap.

agent_types:
  - personal

outcomes:
  - id: pres.plan
    summary: >-
      Pre-drinks shopping list for a group night out within a budget, with
      food if they have not eaten, and the nearest shops selling drinks
    # Only the first four reach the chooser, so they cover both halves of the
    # summary: the list, and where to buy it.
    example_phrases:
      - plan our pres for a night out
      - where can we buy drinks before going out
      - what can we get for pres on our budget
      - pre drinks shopping list
      - how much alcohol should we buy for pres
      - nearest off licence for pres drinks
      - pres for four people with forty quid
      - what snacks and drinks should we get before going out
    inputs:
      - name: start_place
        type: string
        required: false
        description: >-
          Where the group is starting from or will shop, as a place name,
          street, area or postcode (for example "Fallowfield, Manchester").
          Return an empty string if the message does not say; never guess.
      - name: destination
        type: string
        required: false
        description: >-
          Where they are going out to (a venue, street, area or town). Return
          an empty string if the message does not say; never guess.
      - name: leaving_time
        type: string
        required: false
        description: >-
          The time they leave for the night out, as written, for example
          "9pm", "21:30" or "half nine" written as "21:30". Return an empty
          string if no time is given; never guess.
      - name: timezone
        type: timezone
        required: false
        description: >-
          The user's IANA time zone, if known. Leave this out if not known.
      - name: group_size
        type: integer
        required: false
        description: >-
          How many people are drinking at the pres, counting the user. Leave
          this out entirely if the message does not say; never guess.
      - name: budget
        type: number
        required: false
        description: >-
          The total budget for the whole group, in pounds, as a number (40
          for "forty quid"). If they give a budget per person, multiply it
          by the group size. Leave this out entirely if no budget is given.
      - name: priority
        type: string
        required: false
        description: >-
          "cheap" if they want the cheapest options, "tasty" if they care more
          about taste, otherwise an empty string.
      - name: dislikes
        type: string
        required: false
        description: >-
          Drinks the group does not like or will not drink, as a short list
          of words, for example "wine, gin". Return an empty string if none
          are mentioned.
      - name: units_last_7_days
        type: number
        required: false
        description: >-
          UK alcohol units the user says they have drunk over the last seven
          days, converted at these rates: pint of beer or cider 2.3, 330ml
          can or bottle 1.7, 175ml glass of wine 2.1, bottle of wine 9.4,
          single spirit 1. Leave this out entirely if they did not mention
          what they have drunk recently; never guess.
      - name: tolerance
        type: string
        required: false
        description: >-
          "low" if the user says they are a lightweight, get drunk easily or
          want to take it easy; "high" if they say they handle drink well;
          otherwise an empty string.
      - name: has_eaten
        type: boolean
        required: false
        description: >-
          true if the user says they have already eaten, false if they say
          they have not eaten. Leave this out entirely if they do not say.
    output:
      - name: shopping_list
        type: array
        item_type: string
        description: Each item to buy, with quantity and estimated price.
      - name: estimated_total
        type: number
        description: Estimated cost of the whole list, in pounds.
      - name: per_person_cost
        type: number
        description: Estimated cost per person, in pounds.
      - name: budget
        type: number
        required: false
        description: The group budget used, in pounds, if one was given.
      - name: group_size
        type: integer
        description: How many people the list is planned for.
      - name: alcohol_units_per_person
        type: number
        description: UK alcohol units per person in the list.
      - name: hours_until_leaving
        type: number
        required: false
        description: Hours from now until they leave, if a time was given.
      - name: advice
        type: array
        item_type: string
        description: Short notes on pacing, food, strength and assumptions made.
      - name: shops
        type: array
        item_type: string
        required: false
        description: The closest shops selling drinks, with distance and opening hours.
      - name: shops_searched_near
        type: string
        required: false
        description: The place the shops were searched around.
      - name: prices_note
        type: string
        description: Says the prices are typical estimates, not live prices.
